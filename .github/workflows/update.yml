name: 투자온도계 업데이트

on:
  schedule:
    # 23:00 UTC 월~금 = 한국시간 화~토 08:00 (미국장 마감 후)
    - cron: "0 23 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thermometer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 지표 계산 및 대시보드 생성
        run: python thermometer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IRP_CONFIG: ${{ secrets.IRP_CONFIG }}

      - name: 기록 저장 (커밋)
        run: |
          git config user.name "thermometer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_full*.csv history*.csv site
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 실패 알림 (파이썬이 못 보낸 경우)
        if: failure()
        run: |
          if [ ! -f .alert_sent ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="⚠ 투자온도계 업데이트 실패 (GitHub Actions 단계 오류). 대시보드는 이전 값입니다. GitHub → Actions → 투자온도계 업데이트 → Run workflow 로 다시 실행해 보세요." > /dev/null
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
