name: 투자온도계 업데이트

on:
  schedule:
    # 22:30 UTC 월~금 = 한국시간 화~토 07:30 (미국장 마감 후)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thermometer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 지표 계산 및 대시보드 생성
        run: python thermometer.py

      - name: 기록 저장 (커밋)
        run: |
          git config user.name "thermometer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_full.csv history.csv dashboard.html
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push

      - name: 페이지 준비
        run: mkdir -p _site && cp dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
