name: 투자온도계 업데이트

on:
  schedule:
    # 기본 실행은 Oracle 서버(08:05 KST, deploy/oracle). 여기는 서버가 못 보냈을 때만 대신 보내는 예비.
    # 이미 보낸 날(last_sent.txt)은 건너뜀. GitHub 예약은 몇 시간씩 늦을 수 있음.
    - cron: "47 0 * * 1-6"    # 09:47 KST 월~토 (예비)
    - cron: "17 3 * * 1-6"    # 12:17 KST 월~토 (예비)
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thermometer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 보냈는지 확인 (예약 실행만)
        id: chk
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat last_sent.txt 2>/dev/null)" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘($today) 이미 보냄 → 건너뜀"
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.chk.outputs.skip != 'true'

      - name: 지표 계산 및 대시보드 생성
        if: steps.chk.outputs.skip != 'true'
        run: python thermometer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IRP_CONFIG: ${{ secrets.IRP_CONFIG }}

      - name: 기록 저장 (커밋)
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "thermometer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_full*.csv history*.csv site last_sent.txt
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git pull --rebase -q || true
          git push

      - uses: actions/configure-pages@v5
        if: steps.chk.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.skip != 'true'
        with:
          path: site
      - id: deploy
        if: steps.chk.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 실패 알림 (파이썬이 못 보낸 경우)
        if: failure()
        run: |
          if [ ! -f .alert_sent ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="⚠ 투자온도계 업데이트 실패 (GitHub Actions 단계 오류). 대시보드는 이전 값입니다. GitHub → Actions → 투자온도계 업데이트 → Run workflow 로 다시 실행해 보세요." > /dev/null
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
