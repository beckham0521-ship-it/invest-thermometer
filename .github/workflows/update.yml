name: 투자온도계 업데이트

on:
  schedule:
    # 한국시간 화~토. GitHub 예약 실행은 가끔 빠지므로 예비 실행을 두고, 이미 보낸 날은 건너뜀
    # (정각은 전 세계 예약이 몰려 누락이 잦아 몇 분 비켜서 설정)
    # 화~토: 전날 미국장 종가 / 월: 금요일 종가 다시 보내기 (토요일에 못 봤을 때 대비)
    - cron: "7 23 * * 0-5"    # 08:07 KST 월~토 (기본)
    - cron: "37 23 * * 0-5"   # 08:37 KST 월~토 (예비 1)
    - cron: "17 0 * * 1-6"    # 09:17 KST 월~토 (예비 2)
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: thermometer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 이미 보냈는지 확인 (예약 실행만)
        id: chk
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat last_sent.txt 2>/dev/null)" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘($today) 이미 보냄 → 건너뜀"
          fi

      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.chk.outputs.skip != 'true'

      - name: 지표 계산 및 대시보드 생성
        if: steps.chk.outputs.skip != 'true'
        run: python thermometer.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IRP_CONFIG: ${{ secrets.IRP_CONFIG }}

      - name: 기록 저장 (커밋)
        if: steps.chk.outputs.skip != 'true'
        run: |
          git config user.name "thermometer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_full*.csv history*.csv site last_sent.txt
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.chk.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.skip != 'true'
        with:
          path: site
      - id: deploy
        if: steps.chk.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 실패 알림 (파이썬이 못 보낸 경우)
        if: failure()
        run: |
          if [ ! -f .alert_sent ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="⚠ 투자온도계 업데이트 실패 (GitHub Actions 단계 오류). 대시보드는 이전 값입니다. GitHub → Actions → 투자온도계 업데이트 → Run workflow 로 다시 실행해 보세요." > /dev/null
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
